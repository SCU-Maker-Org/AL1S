services:
  al1s-bot:
    image: ghcr.io/scu-maker-org/al1s:${AL1S_IMAGE_TAG:-0.1.0}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AL1S_VERSION: ${AL1S_IMAGE_TAG:-0.1.0}
    container_name: al1s-bot
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    stop_grace_period: 30s

    volumes:
      - ./config.toml:/app/config.toml:ro
      - al1s-data:/app/data
      - al1s-logs:/app/logs
      - app-cache:/app/.cache
      - npm-cache:/app/.npm
      - npm-global:/app/.npm-global

    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m

    environment:
      AL1S_MCP_GITHUB_COMMAND: github-mcp-server
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: Asia/Shanghai

    healthcheck:
      test: ["CMD", "python", "scripts/container_healthcheck.py"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 5m

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

    networks:
      - al1s-bot-network

networks:
  al1s-bot-network:
    driver: bridge

volumes:
  al1s-data:
  al1s-logs:
  app-cache:
  npm-cache:
  npm-global:
