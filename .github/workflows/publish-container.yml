name: Publish OCI images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix; must match pyproject.toml
        required: true
        default: 2.0.0
        type: string
      publish:
        description: Push signed images to GHCR
        required: true
        default: false
        type: boolean

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" ]]; then
            version="${RELEASE_TAG#v}"
            publish=true
          else
            version="${INPUT_VERSION#v}"
            publish="$INPUT_PUBLISH"
          fi
          project_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$version" = "$project_version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  quality:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.11.19
      - run: uv python install 3.13
      - run: uv sync --frozen --group dev --extra proxy
      - run: uv lock --check
      - run: >-
          uv export --frozen --no-dev --extra proxy --extra workspace --no-emit-project
          --format requirements-txt |
          uvx --from pip-audit==2.10.1 pip-audit -r /dev/stdin
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests

  smoke:
    needs: [prepare, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            target: core
            tag: al1s:smoke-amd64
          - platform: linux/arm64
            arch: arm64
            target: core
            tag: al1s:smoke-arm64
          - platform: linux/amd64
            arch: amd64
            target: workspace-runner
            tag: al1s-workspace:smoke-amd64
          - platform: linux/arm64
            arch: arm64
            target: workspace-runner
            tag: al1s-workspace:smoke-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Containerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: ${{ matrix.tag }}
          build-args: AL1S_VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=smoke-${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=smoke-${{ matrix.target }}-${{ matrix.arch }}
      - name: Run core smoke test
        if: matrix.target == 'core'
        run: |
          docker run --rm --platform ${{ matrix.platform }} --entrypoint al1s \
            ${{ matrix.tag }} --config /usr/share/al1s/config.example.toml db migrate
      - name: Run workspace smoke test
        if: matrix.target == 'workspace-runner'
        run: |
          docker run --rm --platform ${{ matrix.platform }} --entrypoint python \
            ${{ matrix.tag }} -c "import al1s.workspace.server"

  publish:
    needs: [prepare, smoke]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: core
            image: ghcr.io/scu-maker-org/al1s
          - target: workspace-runner
            image: ghcr.io/scu-maker-org/al1s-workspace
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Containerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ matrix.image }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: AL1S_VERSION=${{ needs.prepare.outputs.version }}
          provenance: mode=max
          sbom: true
      - name: Test candidate digest
        env:
          CANDIDATE: ${{ matrix.image }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            if [[ "$TARGET" == "core" ]]; then
              docker run --rm --platform "$platform" --entrypoint al1s \
                "$CANDIDATE@$DIGEST" \
                --config /usr/share/al1s/config.example.toml db migrate
            else
              docker run --rm --platform "$platform" --entrypoint python \
                "$CANDIDATE@$DIGEST" -c "import al1s.workspace.server"
            fi
          done
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign tested candidate digest
        env:
          CANDIDATE: ${{ matrix.image }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$CANDIDATE@$DIGEST"
      - name: Promote tested digest
        env:
          CANDIDATE: ${{ matrix.image }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && tag_args+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${tag_args[@]}" "$CANDIDATE@$DIGEST"
