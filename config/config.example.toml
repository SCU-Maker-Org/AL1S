config_version = 1

[transports.telegram]
enabled = true
token_secret = "telegram_bot_token"

[transports.discord]
enabled = true
token_secret = "discord_bot_token"
message_content_intent = false

[models.chat]
base_url = "https://api.openai.com/v1"
api_key_secret = "openai_api_key"
model = "gpt-4o-mini"

[storage]
database_path = "yachiyo.db"

[mcp]
enabled = false

[[mcp.servers]]
name = "workspace"
url = "http://yachiyo-workspace:8000/mcp"
enabled = false
bearer_secret = "workspace_mcp_token"
allowed_tools = [
  "workspace_create",
  "workspace_list_files",
  "workspace_read_file",
  "workspace_write_file",
  "workspace_replace_text",
  "workspace_search",
  "workspace_git",
  "workspace_run_check",
]
trusted_read_only_tools = [
  "workspace_list_files",
  "workspace_read_file",
  "workspace_search",
]
access = "private_admin"
read_only = false
timeout_seconds = 30
max_result_bytes = 262144
allow_insecure_http = true
actor_scoped_workspace = true

[[mcp.servers]]
name = "rss"
url = "http://169.254.1.1:8769/mcp"
enabled = false
bearer_secret = "rss_mcp_token"
allowed_tools = [
  "add_subscription",
  "update_subscription",
  "remove_subscription",
  "list_subscriptions",
  "server_status",
  "fetch_feed",
  "list_entries",
  "read_entry",
  "search_entries",
  "get_digest",
  "mark_entry",
  "star_entry",
  "import_opml",
  "export_opml",
  "discover_feed",
]
read_only = false
access = "public"
confirm_writes = false
allow_insecure_http = true
