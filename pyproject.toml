[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "yachiyo-bot"
version = "2.0.0"
description = "Lightweight Telegram and Discord AI assistant"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
  { name = "TexasOct", email = "aecom233@gmail.com" },
]
keywords = ["telegram", "discord", "bot", "ai", "rag", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "aiogram>=3.31,<4",
  "discord.py>=2.7,<3",
  "aiohttp>=3.14,<4",
  "openai>=3.8,<4",
  "pydantic>=2.13,<3",
  "platformdirs>=4.11,<5",
  "aiosqlite>=0.22,<1",
  "selectolax>=0.4.11,<1",
  "puremagic>=2.2,<3",
]

[project.optional-dependencies]
mcp = ["mcp>=2.1,<3"]
proxy = ["aiohttp-socks>=0.11,<1"]
workspace = [
  "click>=8.3.3,<9",
  "mcp>=2.1,<3",
  "python-multipart>=0.0.31,<1",
  "ruff>=0.16,<1",
  "starlette>=1.3.1,<2",
]

[dependency-groups]
dev = [
  "ruff>=0.16,<1",
]

[project.scripts]
yachiyo = "yachiyo.__main__:main"
yachiyo-workspace-server = "yachiyo.workspace.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yachiyo"]

[tool.ruff]
extend = "config/ruff.toml"
