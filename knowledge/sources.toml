manifest_version = 1

[policy]
allowed_hosts = [
  "www.postgresql.org",
  "www.kernel.org",
  "kubernetes.io",
  "www.llvm.org",
  "docs.pytorch.org",
  "docs.nvidia.com",
  "docs.vllm.ai",
  "cocoonstack.github.io",
]
max_response_bytes = 8388608
timeout_seconds = 30
max_redirects = 5

[[sources]]
id = "cocoon_documentation"
url = "https://cocoonstack.github.io/cocoon/"
title = "Cocoon Sandbox Documentation"
domains = ["sys", "distributed", "storage", "cloud", "security"]
product = "Cocoon"
version = "master"
license = "MIT"
trust_level = "official"

