config_version = 1
default_role = "alice"

[app]
name = "AL1S"
instance_id = "default"
debug = false

[transports.telegram]
enabled = true
token_secret = "telegram_bot_token"
admin_user_ids = []

[transports.discord]
enabled = false
token_secret = "discord_bot_token"
admin_user_ids = []
allowed_guild_ids = []
allow_direct_messages = true
sync_commands = true

[models.chat]
base_url = "https://api.openai.com/v1"
api_key_secret = "openai_api_key"
model = "gpt-4o-mini"
api_mode = "chat_completions"
timeout_seconds = 60
max_retries = 1
max_output_tokens = 2000
token_parameter = "max_completion_tokens"
temperature = 0.7
max_concurrency = 4
max_tool_rounds = 4
max_tool_calls = 12

[models.embedding]
base_url = "https://api.openai.com/v1"
api_key_secret = "openai_api_key"
model = "text-embedding-3-small"
dimensions = 1536
request_dimensions = true
batch_size = 64

[storage]
database_path = "al1s.db"
busy_timeout_ms = 5000
message_retention_days = 365

[rag]
enabled = true
top_k = 8
dense_candidates = 30
sparse_candidates = 30
chunk_chars = 1600
chunk_overlap_chars = 200
max_chunks_per_document = 1000
max_document_bytes = 8388608

[memory]
enabled = true
private_auto_learning = true
group_auto_learning = false
max_entries_per_scope = 1000
prompt_results = 5

[mcp]
enabled = false

[[mcp.servers]]
name = "workspace"
url = "http://al1s-workspace:8000/mcp"
enabled = false
bearer_secret = "workspace_mcp_token"
allowed_tools = [
  "workspace_create",
  "workspace_list_files",
  "workspace_read_file",
  "workspace_write_file",
  "workspace_replace_text",
  "workspace_search",
  "workspace_git",
  "workspace_run_check",
]
trusted_read_only_tools = [
  "workspace_list_files",
  "workspace_read_file",
  "workspace_search",
]
access = "private_admin"
read_only = false
timeout_seconds = 30
max_result_bytes = 262144
allow_insecure_http = true
actor_scoped_workspace = true

[media]
enabled = false
api_key_secret = "dashscope_api_key"
base_url = "https://dashscope.aliyuncs.com/api/v1"
image_model = "qwen-image-2.0-pro"
speech_model = "qwen-audio-3.0-tts-flash"
speech_voice = "longanhuan_v3.6"
max_artifact_bytes = 20971520

[reverse_image]
enabled = false
trace_moe_enabled = true
saucenao_enabled = false
saucenao_api_key_secret = "saucenao_api_key"
max_image_bytes = 12582912
max_results = 5

[policies]
max_attachment_bytes = 20971520
max_input_images = 4
max_output_artifacts = 10
max_output_artifact_bytes = 52428800
max_history_messages = 30
max_history_chars = 40000
request_timeout_seconds = 120

[policies.group]
enabled = true
require_mention = true
allow_reply_trigger = true
observe_unmentioned_messages = false
session_scope = "topic"
wake_words = ["AL1S", "爱丽丝"]
allowed_chat_ids = []
blocked_chat_ids = []
allowed_thread_ids = []
blocked_thread_ids = []
context_buffer_size = 30
context_buffer_ttl_seconds = 1800

[policies.rate_limit]
per_user_requests = 10
per_user_window_seconds = 60
per_chat_requests = 30
per_chat_window_seconds = 60

[profile]
enabled = true
max_document_bytes = 32768
max_prompt_chars = 8000
reject_secrets = true

[workspace]
root = "/workspaces"
max_file_bytes = 262144
max_results = 200
command_timeout_seconds = 25

[logging]
level = "INFO"
json_output = true

[[roles]]
name = "alice"
description = "可靠、直接的通用 AI 助手"
system_prompt = "你是 AL1S。准确、直接地回答，明确区分事实、推断和不确定信息。"
greeting = "你好，我是 AL1S。"
farewell = "再见。"
